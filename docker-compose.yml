services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres_container
        restart: always
        environment:
            POSTGRES_DB: home_energy_tracker
            POSTGRES_USER: homeEnergyUser
            POSTGRES_PASSWORD: homeEnergyPassword
        ports:
            - "2222:5432"
        volumes:
            - ./docker/postgres/initdb.sql:/docker-entrypoint-initdb.d/init.sql
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: